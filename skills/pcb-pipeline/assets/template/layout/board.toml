# 板框、层数、制造下限与网络类（pcbkit/board_setup.py 读取，生成或更新电路板与工程文件）。
# 制造下限按板厂能力表填写，并在 docs/DECISIONS.md 记下来源与查询日期；下面是保守的双层板起点。

[board]
layers = {{layers}}
thickness_mm = 1.6
outline = { shape = "rect", width = {{width}}, height = {{height}}, corner_radius = 1.0, origin = [100, 100] }

[rules]
min_track_width = 0.15
min_clearance = 0.15
min_via_diameter = 0.6
min_through_hole = 0.3
min_hole_to_hole = 0.5
min_copper_edge_clearance = 0.3
min_hole_clearance = 0.25

[[netclass]]
name = "Default"
track_width = 0.25
clearance = 0.2
via_diameter = 0.6
via_drill = 0.3

[[netclass]]
name = "POWER"
track_width = 0.5
clearance = 0.2
via_diameter = 0.8
via_drill = 0.4
patterns = ["GND", "VBUS", "+*V*"]

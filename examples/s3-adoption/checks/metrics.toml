why = "EP 散热/接地过孔不减少"

[[metric]]
id = "min_width_mm"
kind = "min_track_width_mm"
nets = ["LX1", "VCC3V3", "VSYS", "VBUS", "VBAT1", "BAT_NEG", "PA_OUT_P", "PA_OUT_N", "SPK_P", "SPK_N"]
each_min = {"LX1" = 0.3, "VCC3V3" = 0.2, "VSYS" = 0.2, "VBUS" = 0.2, "VBAT1" = 0.2, "BAT_NEG" = 0.2, "PA_OUT_P" = 0.35, "PA_OUT_N" = 0.35, "SPK_P" = 0.3, "SPK_N" = 0.3}
why = "电源、开关节点与喇叭线最小线宽不变细"


# S3 review metrics: checks/thresholds.json of v0.2.1 rewritten as declarative pcbkit metrics.
# Values are the v0.2/v0.2.1 measurements ("no regression"); loosening needs a reason in the PR.

[[metric]]
id = "in1_tracks"
kind = "tracks_on_layer"
layer = "In1.Cu"
eq = 0
why = "In1 是完整 GND 平面，不允许走线"

[[metric]]
id = "in1_gnd_single_piece"
kind = "zone_islands"
net = "GND"
layer = "In1.Cu"
eq = 1
why = "In1 地平面不能被切碎（新增，v0.2.1 实测 1 块）"

[[metric]]
id = "antenna_area_non_rf_items"
kind = "items_in_area"
area = "Antenna keepout"
allow_nets = ["RF_ANT", "LNA_IN", "RF_SHUNT"]
eq = 0
why = "天线净空区只允许 RF 馈线"

[[metric]]
id = "rf_layers"
kind = "net_layers"
nets = ["RF_ANT", "LNA_IN", "RF_SHUNT"]
eq = {"RF_ANT" = ["F.Cu"], "LNA_IN" = ["F.Cu"], "RF_SHUNT" = ["F.Cu"]}
why = "RF 链只在表层，不换层"

[[metric]]
id = "rf_length_mm"
kind = "net_length_mm"
nets = ["RF_ANT", "LNA_IN", "RF_SHUNT"]
sum = true
max = 11.0
why = "RF 链长度不比 v0.2（10.99 mm）变长"

[[metric]]
id = "C9_to_U1pin1_mm"
kind = "pad_distance_mm"
a = "C9.2"
b = "U1.1"
max = 1.2
why = "LNA 匹配电容紧贴 U1 pin 1"

[[metric]]
id = "side_differs_from_original"
kind = "script"
path = "gen/check_v02.py"
key = "side_differs_from_original"
eq = []
why = "器件面别与原板一致（项目脚本，依赖装配锚点）"

[[metric]]
id = "sides"
kind = "footprint_sides"
eq = {"F" = 159, "B" = 43}
why = "正反面器件数不变"

[[metric]]
id = "moved_more_than_0p6mm"
kind = "moved_from"
anchors = "data/assembly-anchors.json"
origin = [100.0, 99.98]
tolerance_mm = 0.6
keys_subset = ["C13", "CP6", "CP7", "H1", "J1", "Key1", "Key2", "RP3", "RP4"]
why = "偏离原板位置 >0.6 mm 的器件不增加"

[[metric]]
id = "via_sizes"
kind = "via_sizes"
keys_subset = ["0.3/0.15", "0.45/0.2"]
each_max = {"0.3/0.15" = 13}
why = "只用两种过孔规格；0.3/0.15 小孔只用于 U1 出线（≤ 13）"

[[metric]]
id = "usb_length_mm"
kind = "net_length_mm"
nets = ["USB_P", "USB_N"]
each_max = {"USB_P" = 16.0, "USB_N" = 16.0}
why = "USB 对就近走线"

[[metric]]
id = "usb_vias"
kind = "net_vias"
nets = ["USB_P", "USB_N"]
each_max = {"USB_P" = 3, "USB_N" = 4}
why = "USB 换层不增加"

[[metric]]
id = "ep_vias_U1"
kind = "vias_in_pad"
pad = "U1.57"
min = 9
why = "EP 散热/接地过孔不减少"

[[metric]]
id = "ep_vias_UP1"
kind = "vias_in_pad"
pad = "UP1.41"
min = 9
why = "EP 散热/接地过孔不减少"

